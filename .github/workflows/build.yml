name: build

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install React dependencies
        run: npm ci --ignore-scripts

      - name: Test React core
        run: npm test -- --run

      - name: Typecheck React and Electron
        run: npm run typecheck

      - name: Build React renderer
        run: npm run build

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: CourseToIcal-react-dist
          path: dist/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CourseToIcal.sln

      - name: Build
        run: dotnet build CourseToIcal.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet run --project tests/CourseToIcal.Tests/CourseToIcal.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish src/CourseToIcal.App/CourseToIcal.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CourseToIcal-win-x64
          path: publish/
